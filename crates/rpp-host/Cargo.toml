[package]
name = "rpp-host"
description = "Native sources for presence scripts: processes, windows, media sessions, files and HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rpp-plugins = { path = "../rpp-plugins" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"
windows-future = "0.3"
windows-registry = "0.6"

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net"] }
tempfile = "3"

# Win32 calls need `unsafe`; it is confined to the `win32` and `media` modules.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
