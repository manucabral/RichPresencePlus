[package]
name = "rpp-catalog"
description = "Signed catalog of presences: verify the index, download and install presences."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
hmac = "0.13"
rpp-plugins = { path = "../rpp-plugins" }
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
ureq = "3"

[dev-dependencies]
proptest.workspace = true
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
tempfile = "3"

[lints]
workspace = true
