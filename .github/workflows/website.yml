name: website

# Builds the site and, from main, publishes it on GitHub Pages. A new release
# also rebuilds it, since the download button comes from the latest release.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "presences/*/manifest.json"
      - "presences/*/locales/**"
      - "frontend/src/shared/browse.ts"
      - "frontend/src/shared/presence.ts"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "presences/*/manifest.json"
      - ".github/workflows/website.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - name: Build and check
        working-directory: website
        env:
          # Only for the release lookup during the build; it never reaches a page.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec astro check
          pnpm build
          pnpm test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  publish:
    if: github.event_name != 'pull_request' && github.ref_type != 'tag' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
