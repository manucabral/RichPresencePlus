name: release

# Builds the installer for a version tag, signs it for Windows and for the
# updater, and drafts a release for a maintainer to review. The build job runs
# every dependency's code, so it gets no secret; signing happens on machines
# that build nothing. Windows signing goes through SignPath and runs only when
# the SIGNPATH_ORGANIZATION_ID variable is set; without it the installer ships
# unsigned for Windows.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The updater compares the program's own version with latest.json, which
      # takes the tag's: if they differed, it would offer the same build forever.
      - name: Check that the tag is the program's version
        shell: bash
        run: node tools/version.mjs --tag "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check before building
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          node tools/check-locales.mjs
          node --test "tools/test/*.test.mjs"
      - name: Build the interface
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Build the installer
        env:
          # Keeps the build machine's paths out of panic messages.
          RUSTFLAGS: --remap-path-prefix=C:\Users\runneradmin\.cargo=/cargo --remap-path-prefix=${{ github.workspace }}=/src
        run: |
          cargo install tauri-cli --version "=2.12.4" --locked
          cargo tauri build
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # Before the updater signature, which covers the installer's final bytes.
  windows-signing:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sign the installer for Windows
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: RichPresencePlus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 5000
          output-artifact-directory: signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-signed
          path: signed/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [build, windows-signing]
    # Runs after a signature, or right after the build when signing is not set up.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows-signing.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.windows-signing.result == 'success' && 'installer-signed' || 'installer' }}
          path: installer
      # GitHub turns the spaces of an uploaded name into dots; renamed here, the
      # file keeps one name in the release, the signature and latest.json.
      - name: Name the installer as GitHub will
        run: |
          for file in installer/*-setup.exe; do
            mv "$file" "installer/$(basename "$file" | tr ' ' '.')"
          done
      - name: Sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The app requires the signature to name the version (requireSignedVersion);
        # without it every copy refuses the update.
        run: cargo tauri signer sign --app-version "${GITHUB_REF_NAME#v}" installer/*-setup.exe
      - name: Describe the release for the updater
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer=$(ls installer/*-setup.exe | head -n 1)
          node tools/latest-json.mjs --version "$version" --repo "$GITHUB_REPOSITORY" \
            --installer "$installer" --signature "$installer.sig" --out installer/latest.json
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --repo "$GITHUB_REPOSITORY" \
            installer/*-setup.exe \
            installer/*-setup.exe.sig \
            installer/latest.json
