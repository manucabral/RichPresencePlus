name: catalog

# Pull requests that change a presence build and sign the index with a key made
# on the spot, with no secret. Publishing is manual and waits for a maintainer
# to approve the `catalog-publication` environment, which holds the real key.

on:
  pull_request:
    paths:
      - "presences/**"
      - "tools/catalog.mjs"
      - "tools/test/**"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish
        type: choice
        options: [stable, experimental]
        default: stable

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci presences tools
      - run: node --test "tools/test/*.test.mjs"
      - run: node tools/check-locales.mjs
      - name: Build an index with a throwaway key
        run: |
          node tools/catalog.mjs keygen "$RUNNER_TEMP/throwaway.pem"
          node tools/catalog.mjs build --bundles --commit "$GITHUB_SHA" --key-file "$RUNNER_TEMP/throwaway.pem" --out "$RUNNER_TEMP/catalog.json"
          node tools/catalog.mjs bundles --out "$RUNNER_TEMP/bundles"

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: catalog-publication
    concurrency:
      group: catalog-stats
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test "tools/test/*.test.mjs"
      # Bundles go up before the index that names them, so a live index never
      # points at missing files.
      - name: Upload the bundles to the channel's releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/catalog.mjs bundles --channel "$CHANNEL" --out "$RUNNER_TEMP/bundles"
          node tools/catalog-releases.mjs upload --channel "$CHANNEL" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/bundles"
      - name: Build and sign the index
        env:
          RPP_CATALOG_KEY: ${{ secrets.RPP_CATALOG_KEY }}
        run: node tools/catalog.mjs build --bundles --commit "$GITHUB_SHA" --channel "$CHANNEL" --out "$RUNNER_TEMP/catalog.json"
      - name: Publish on the channel branch
        run: |
          branch=catalog
          [ "$CHANNEL" = "experimental" ] && branch=catalog-experimental
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$branch" || true
          if git rev-parse --verify "origin/$branch" >/dev/null 2>&1; then
            git switch --detach "origin/$branch"
          else
            git switch --orphan "$branch"
            git rm -rf --quiet . || true
          fi
          cp "$RUNNER_TEMP/catalog.json" catalog.json
          git add catalog.json
          git commit -m "chore: publish the $CHANNEL catalog for ${GITHUB_SHA::8}"
          git push origin "HEAD:refs/heads/$branch"
      # Old bundles go once the new index is live, and their download counts
      # reach the ledger on catalog-stats before any delete.
      - name: Record and delete old bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The tools come from the published commit; this step switches branches.
          git switch --detach "$GITHUB_SHA"
          cp -r tools "$RUNNER_TEMP/tools"
          git fetch origin catalog-stats || true
          git show origin/catalog-stats:retired.json > "$RUNNER_TEMP/retired.json" 2>/dev/null || echo '{"assets":{}}' > "$RUNNER_TEMP/retired.json"
          node "$RUNNER_TEMP/tools/catalog-releases.mjs" prune --channel "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/bundles" --ledger "$RUNNER_TEMP/retired.json" --plan "$RUNNER_TEMP/plan.json"
          if [ "$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).length)' "$RUNNER_TEMP/plan.json")" = "0" ]; then
            exit 0
          fi
          if git rev-parse --verify origin/catalog-stats >/dev/null 2>&1; then
            git switch --detach origin/catalog-stats
          else
            git switch --orphan catalog-stats
            git rm -rf --quiet . || true
          fi
          cp "$RUNNER_TEMP/retired.json" retired.json
          git add retired.json
          git commit -m "chore: record downloads of retired $CHANNEL bundles"
          git push origin HEAD:refs/heads/catalog-stats
          node "$RUNNER_TEMP/tools/catalog-releases.mjs" delete --repo "$GITHUB_REPOSITORY" --plan "$RUNNER_TEMP/plan.json"
