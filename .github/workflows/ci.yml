name: ci

# The same checks a release runs, on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # rpp-host calls Win32 and WinRT, so the workspace builds on Windows.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - name: Lint presences, extension and tools
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
      - name: Interface
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec tsc -b
          pnpm --dir frontend test
          pnpm --dir frontend build
          node tools/try-interface.mjs
      - name: Extension
        run: |
          pnpm --dir extension install --frozen-lockfile
          pnpm --dir extension test
      - name: Tools and translations
        run: |
          node --test "tools/test/*.test.mjs"
          node tools/check-locales.mjs
      - name: Known vulnerabilities in JavaScript packages
        run: |
          pnpm --dir frontend audit --prod
          pnpm --dir extension audit
          pnpm --dir website audit

  audit:
    # Advisories, licenses and sources of every crate in Cargo.lock (deny.toml).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --locked
      - run: cargo deny --locked check
