name: Application feature request
description: Suggest something new for the application or the browser extension.
labels: ["idea", "application"]

body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and discussions and this one is new.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: Describe the situation, not only the solution.
      placeholder: I want to hide my activity while I share my screen
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Application
        - Browser extension
        - Website
        - Writing presences
    validations:
      required: true
